# spark_local.conf
# ================
# Tuned for GitHub Codespaces free tier (2-core / 4 GB)
# and local dev machines with constrained RAM.
#
# Usage:
#   spark-submit --properties-file configs/spark_local.conf jobs/your_job.py
#
# Or load programmatically in spark_factory.py via SparkConf.

# ── Execution mode ────────────────────────────────────────────────────────────
spark.master                            local[2]
# 2 threads: 1 for driver tasks, 1 for shuffle. Keeps RSS under 1 GB.

# ── Memory ────────────────────────────────────────────────────────────────────
spark.driver.memory                     1g
# No executor memory in local mode — driver IS the executor.

spark.driver.maxResultSize              256m
# Prevents collect() from blowing the heap on large results.

spark.memory.fraction                   0.6
# 60% of heap for execution+storage, 40% for user data structures.

spark.memory.storageFraction            0.3
# Of the 60%, 30% reserved for cached RDDs/DataFrames.
# Low because we avoid caching in production jobs.

# ── Serialization ─────────────────────────────────────────────────────────────
spark.serializer                        org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max         64m

# ── Shuffle ───────────────────────────────────────────────────────────────────
spark.sql.shuffle.partitions            4
# Default 200 is catastrophically slow on 10k-row AdventureWorks data.
# 4 partitions is optimal for local[2] with small datasets.

spark.shuffle.compress                  true
spark.shuffle.spill.compress            true
# Compress shuffle files — significant savings on Codespace disk quota.

# ── I/O ───────────────────────────────────────────────────────────────────────
spark.sql.files.maxPartitionBytes       67108864
# 64 MB per partition when reading Parquet. Keeps partition count low.

spark.sql.adaptive.enabled              true
spark.sql.adaptive.coalescePartitions.enabled  true
spark.sql.adaptive.coalescePartitions.minPartitionNum  1
# AQE coalesces shuffle partitions at runtime — handles data skew automatically.

spark.sql.parquet.compression.codec     snappy
# snappy: fast decompression (read-heavy workloads), moderate compression ratio.

# ── Broadcast join threshold ──────────────────────────────────────────────────
spark.sql.autoBroadcastJoinThreshold    20971520
# 20 MB. Dimension tables (territory, product, etc.) are <5 MB — always broadcast.
# Prevents sort-merge joins on small dimension tables.

# ── UI & logging ─────────────────────────────────────────────────────────────
spark.ui.enabled                        true
spark.ui.port                           4040
spark.ui.showConsoleProgress            false
# Suppress per-task progress bars — clutters pipeline logs.

# ── Speculative execution ─────────────────────────────────────────────────────
spark.speculation                       false
# Disabled in local mode — speculative tasks would just duplicate work.

# ── Python ────────────────────────────────────────────────────────────────────
spark.pyspark.python                    python3
spark.pyspark.driver.python             python3
